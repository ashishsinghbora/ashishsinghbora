name: Update Profile README

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'

# Ensure concurrent runs do not conflict
concurrency:
  group: profile-readme-update
  cancel-in-progress: true

jobs:
  update-readme:
    name: Generate & Verify Profile README
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Update Profile Sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_profile.py

      - name: Commit & Push Changes
        run: |
          if git diff --quiet README.md; then
            echo "No README changes detected. Working tree clean."
          else
            echo "Changes detected in README.md. Committing updates..."
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(profile): auto-update README [skip ci]"
            git push
          fi
