name: Update Profile README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate pre-state and run tests
        run: |
          python scripts/validate_profile.py
          python -m unittest discover -s tests

      - name: Run profile updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Validate post-update state
        run: python scripts/validate_profile.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md assets/profile-metrics.svg
          if git diff --staged --quiet; then
            echo "No profile changes detected. Repository clean."
            exit 0
          fi
          git commit -m "chore: update profile metrics and activity"
          git push
